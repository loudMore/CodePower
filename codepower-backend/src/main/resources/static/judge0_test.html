<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Judge0 API 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            color: #333;
        }
        .section {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #response {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            margin-bottom: 10px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Judge0 API 测试工具</h1>
    
    <div class="section">
        <h2>测试选项</h2>
        <button id="testRawJson">使用原始JSON字符串测试</button>
        <button id="testRestTemplate">使用RestTemplate测试</button>
        <button id="testStandard">使用标准代码测试控制器</button>
    </div>
    
    <div class="section">
        <h2>自定义代码测试</h2>
        <textarea id="sourceCode">#include <iostream>

int main() {
    std::cout << "Hello, World!" << std::endl;
    return 0;
}</textarea>
        <div>
            <label for="languageId">语言ID: </label>
            <input type="number" id="languageId" value="54" /> (默认: 54 - C++ GCC 9.2.0)
        </div>
        <div>
            <label for="stdin">标准输入(可选): </label>
            <textarea id="stdin">Judge0</textarea>
        </div>
        <button id="testCustomCode">测试自定义代码</button>
    </div>
    
    <div class="section">
        <h2>响应结果</h2>
        <div id="response">等待测试...</div>
    </div>

    <script>
        document.getElementById('testRawJson').addEventListener('click', function() {
            callApi('/api/code/test-judge0-raw');
        });
        
        document.getElementById('testRestTemplate').addEventListener('click', function() {
            callApi('/api/code/test-judge0');
        });
        
        document.getElementById('testStandard').addEventListener('click', function() {
            // 使用标准测试接口，模拟一个测试请求
            const payload = {
                code: btoa('#include <iostream>\n\nint main() {\n    std::cout << "Hello, World!" << std::endl;\n    return 0;\n}'),
                isBase64Encoded: true,
                languageId: 54,
                stdin: btoa('Judge0'),
                timeLimit: 1000,
                memoryLimit: 262144
            };
            
            callApi('/api/code/test/1', payload);
        });
        
        document.getElementById('testCustomCode').addEventListener('click', function() {
            const sourceCode = document.getElementById('sourceCode').value;
            const languageId = parseInt(document.getElementById('languageId').value) || 54;
            const stdin = document.getElementById('stdin').value;
            
            const payload = {
                code: btoa(sourceCode),
                isBase64Encoded: true,
                languageId: languageId,
                stdin: btoa(stdin),
                timeLimit: 1000,
                memoryLimit: 262144
            };
            
            callApi('/api/code/test/1', payload);
        });
        
        function callApi(url, data = {}) {
            const responseElem = document.getElementById('response');
            responseElem.textContent = '请求中...';
            
            const options = {
                method: data && Object.keys(data).length > 0 ? 'POST' : 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            };
            
            if (options.method === 'POST') {
                options.body = JSON.stringify(data);
            }
            
            fetch(url, options)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误! 状态: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 格式化输出，突出显示解码后的结果
                    let formattedOutput = '';
                    
                    // 添加解码后的输出结果
                    if (data.stdout) {
                        formattedOutput += '<h3>标准输出:</h3>';
                        formattedOutput += `<pre>${escapeHtml(data.stdout)}</pre>`;
                    }
                    
                    if (data.stderr) {
                        formattedOutput += '<h3>标准错误:</h3>';
                        formattedOutput += `<pre>${escapeHtml(data.stderr)}</pre>`;
                    }
                    
                    if (data.compile_output) {
                        formattedOutput += '<h3>编译输出:</h3>';
                        formattedOutput += `<pre>${escapeHtml(data.compile_output)}</pre>`;
                    }
                    
                    if (data.status) {
                        formattedOutput += '<h3>状态:</h3>';
                        formattedOutput += `<pre>${JSON.stringify(data.status, null, 2)}</pre>`;
                    }
                    
                    if (data.time) {
                        formattedOutput += '<h3>执行时间:</h3>';
                        formattedOutput += `<pre>${data.time} 秒</pre>`;
                    }
                    
                    if (data.memory) {
                        formattedOutput += '<h3>内存使用:</h3>';
                        formattedOutput += `<pre>${data.memory} KB</pre>`;
                    }
                    
                    // 添加完整的JSON响应
                    formattedOutput += '<h3>完整响应:</h3>';
                    formattedOutput += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    responseElem.innerHTML = formattedOutput;
                })
                .catch(error => {
                    responseElem.textContent = `发生错误: ${error.message}`;
                });
        }
        
        // 转义HTML特殊字符，防止XSS
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        // Base64编码函数
        function btoa(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }
    </script>
</body>
</html>
