spring.application.name=codepower-backend
debug=${SPRING_BOOT_DEBUG:false}
server.port=${SERVER_PORT:8080}
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
spring.threads.virtual.enabled=${VIRTUAL_THREADS_ENABLED:true}

# DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/codepower?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:SET time_zone = '+08:00'}

# MyBatis Plus
mybatis-plus.mapper-locations=classpath:/mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.type-aliases-package=com.ls.domain

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration-baseline}
spring.flyway.sql-migration-prefix=${FLYWAY_SQL_MIGRATION_PREFIX:V}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}

# Mail
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:16}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT_MS:3000ms}

# OAuth login providers. Keep secrets in environment variables or application-prod.properties.
oauth.frontend-callback-url=${OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/callback}
oauth.github.enabled=${OAUTH_GITHUB_ENABLED:false}
oauth.github.client-id=${OAUTH_GITHUB_CLIENT_ID:}
oauth.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:}
oauth.github.redirect-uri=${OAUTH_GITHUB_REDIRECT_URI:http://localhost:8080/api/oauth/github/callback}
oauth.gitee.enabled=${OAUTH_GITEE_ENABLED:false}
oauth.gitee.client-id=${OAUTH_GITEE_CLIENT_ID:}
oauth.gitee.client-secret=${OAUTH_GITEE_CLIENT_SECRET:}
oauth.gitee.redirect-uri=${OAUTH_GITEE_REDIRECT_URI:http://localhost:8080/api/oauth/gitee/callback}
oauth.qq.enabled=${OAUTH_QQ_ENABLED:false}
oauth.qq.client-id=${OAUTH_QQ_CLIENT_ID:}
oauth.qq.client-secret=${OAUTH_QQ_CLIENT_SECRET:}
oauth.qq.redirect-uri=${OAUTH_QQ_REDIRECT_URI:http://localhost:8080/api/oauth/qq/callback}
oauth.wechat.enabled=${OAUTH_WECHAT_ENABLED:false}
oauth.wechat.client-id=${OAUTH_WECHAT_CLIENT_ID:}
oauth.wechat.client-secret=${OAUTH_WECHAT_CLIENT_SECRET:}
oauth.wechat.redirect-uri=${OAUTH_WECHAT_REDIRECT_URI:http://localhost:8080/api/oauth/wechat/callback}

# Judge0
judge0.api.url=${JUDGE0_API_URL:http://127.0.0.1:2358}
judge0.api.connect-timeout-ms=${JUDGE0_CONNECT_TIMEOUT_MS:5000}
judge0.api.read-timeout-ms=${JUDGE0_READ_TIMEOUT_MS:30000}
judge0.api.max-processes-and-threads=${JUDGE0_MAX_PROCESSES_AND_THREADS:2}
judge0.api.jvm-max-processes-and-threads=${JUDGE0_JVM_MAX_PROCESSES_AND_THREADS:32}
judge0.api.max-memory-kb=${JUDGE0_MAX_MEMORY_KB:512000}
judge0.api.wall-time-limit-seconds=${JUDGE0_WALL_TIME_LIMIT_SECONDS:3.0}
judge0.api.cpu-extra-time-seconds=${JUDGE0_CPU_EXTRA_TIME_SECONDS:0.5}
judge0.api.max-concurrent-submissions=${JUDGE0_MAX_CONCURRENT_SUBMISSIONS:3}
judge0.api.acquire-timeout-ms=${JUDGE0_ACQUIRE_TIMEOUT_MS:10000}
judge0.api.enable-per-process-and-thread-time-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:false}
judge0.api.enable-per-process-and-thread-memory-limit=${JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:false}
judge0.nodes[0].name=${JUDGE0_NODE_A_NAME:${JUDGE0_NODE_PRIMARY_NAME:JudgeCluster-A}}
judge0.nodes[0].url=${JUDGE0_NODE_PRIMARY_URL:${JUDGE0_API_URL:http://127.0.0.1:2358}}
judge0.nodes[0].enabled=${JUDGE0_NODE_PRIMARY_ENABLED:true}
judge0.nodes[0].weight=${JUDGE0_NODE_PRIMARY_WEIGHT:1}
judge0.nodes[0].max-concurrent=${JUDGE0_NODE_PRIMARY_MAX_CONCURRENT:${JUDGE0_MAX_CONCURRENT_SUBMISSIONS:3}}
judge0.nodes[0].workers=${JUDGE0_NODE_A_WORKERS:${JUDGE0_NODE_PRIMARY_WORKERS:4}}
judge0.nodes[0].auth-header=${JUDGE0_NODE_PRIMARY_AUTH_HEADER:}
judge0.nodes[0].auth-token=${JUDGE0_NODE_PRIMARY_AUTH_TOKEN:}
judge0.nodes[1].name=${JUDGE0_NODE_B_NAME:${JUDGE0_NODE_8H8G_NAME:JudgeCluster-B}}
judge0.nodes[1].url=${JUDGE0_NODE_8H8G_URL:}
judge0.nodes[1].enabled=${JUDGE0_NODE_8H8G_ENABLED:false}
judge0.nodes[1].weight=${JUDGE0_NODE_8H8G_WEIGHT:2}
judge0.nodes[1].max-concurrent=${JUDGE0_NODE_8H8G_MAX_CONCURRENT:6}
judge0.nodes[1].workers=${JUDGE0_NODE_8H8G_WORKERS:8}
judge0.nodes[1].auth-header=${JUDGE0_NODE_8H8G_AUTH_HEADER:X-Judge0-Token}
judge0.nodes[1].auth-token=${JUDGE0_NODE_8H8G_AUTH_TOKEN:}
judge0.queue.worker-count=${JUDGE0_QUEUE_WORKER_COUNT:9}
judge0.queue.capacity=${JUDGE0_QUEUE_CAPACITY:1000}
judge0.rate-limit.enabled=${JUDGE0_RATE_LIMIT_ENABLED:true}
judge0.rate-limit.window-ms=${JUDGE0_RATE_LIMIT_WINDOW_MS:1000}
judge0.rate-limit.max-requests=${JUDGE0_RATE_LIMIT_MAX_REQUESTS:1}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ls=${LOG_LEVEL_APP:INFO}
logging.level.com.ls.config.JwtAuthenticationFilter=${LOG_LEVEL_JWT_FILTER:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SPRING_SECURITY:INFO}
logging.level.org.springframework.boot.autoconfigure=${LOG_LEVEL_BOOT_AUTOCONFIG:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# AI Service (Silicon Flow / GLM-5.1)
ai.api.url=${AI_API_URL:https://api.siliconflow.cn/v1}
ai.api.key=${AI_API_KEY:}
ai.api.model=${AI_API_MODEL:deepseek-ai/DeepSeek-V3}

# Devtools
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:true}
